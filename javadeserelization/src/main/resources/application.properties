# TechRepair Application Configuration
server.port=80
server.servlet.context-path=/

# Application Info
spring.application.name=TechRepair Service
server.servlet.session.timeout=30m

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging Configuration
logging.level.com.techrepair=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Vulnerable Configuration (for educational purposes)
# These settings make deserialization vulnerabilities easier to exploit
spring.jmx.enabled=false
management.endpoints.enabled-by-default=false