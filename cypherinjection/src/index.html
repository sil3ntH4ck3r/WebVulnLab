<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cypher Injection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- ───────────────── Header ───────────────── -->
    <header>
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4" width="18" height="18" rx="2" fill="#4285F4"/>
          <path d="M8 2V6" stroke="#202124" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 2V6" stroke="#202124" stroke-width="2" stroke-linecap="round"/>
          <path d="M3 10H21" stroke="white" stroke-width="2"/>
          <rect x="7" y="12" width="4" height="4" rx="1" fill="white"/>
        </svg>
        <h1>Calendario</h1>
      </div>

      <div class="view-controls">
        <button id="month-view-btn" class="active">Mes</button>
        <button id="week-view-btn">Semana</button>
        <button id="day-view-btn">Día</button>
      </div>

      <div class="actions">
        <button id="today-btn">Hoy</button>
        <button id="add-event-btn" class="primary">+ Evento</button>
      </div>
      <!-- ─────────────────────────────  BÚSQUEDA (WIP)  ───────────────────────────
      <form id="search-form" style="margin-left:auto; display:flex; gap:4px">
        <input id="search-input"
              type="text"
              placeholder="Buscar eventos… (prototipo)"
              style="padding:4px 8px; border:1px solid #ccc; border-radius:4px; min-width:180px">
        <button type="submit"
                style="padding:4px 12px; border:none; background:#4285F4; color:#fff; border-radius:4px">
          🔍
        </button>
      </form>
      ───────────────────────────────────────────────────────────────────────────── -->
    </header>

    <!-- ───────────────── Main content ───────────────── -->
    <div class="main-content">
      <!-- Sidebar de categorías -->
      <aside class="sidebar">
        <h3>Categorías</h3>
        <div class="calendar-categories">
          <div class="category"><div class="color-dot" style="background:#4285F4"></div><span>Trabajo</span></div>
          <div class="category"><div class="color-dot" style="background:#34A853"></div><span>Personal</span></div>
          <div class="category"><div class="color-dot" style="background:#FBBC05"></div><span>Familia</span></div>
          <div class="category"><div class="color-dot" style="background:#EA4335"></div><span>Importante</span></div>
        </div>
      </aside>

      <!-- Contenedor del calendario -->
      <section class="calendar-container">
        <div class="calendar-header">
          <div class="calendar-navigation">
            <button id="prev-btn">&lt;</button>
            <h2 class="calendar-title"></h2>
            <button id="next-btn">&gt;</button>
          </div>
        </div>

        <!-- Vistas -->
        <div id="month-view"><div class="month-grid">
          <!-- encabezados -->
          <div class="weekday-header">Dom</div><div class="weekday-header">Lun</div>
          <div class="weekday-header">Mar</div><div class="weekday-header">Mié</div>
          <div class="weekday-header">Jue</div><div class="weekday-header">Vie</div>
          <div class="weekday-header">Sáb</div>
        </div></div>

        <div id="week-view" class="week-view" style="display:none">
          <div class="time-grid"></div>
        </div>

        <div id="day-view" class="day-view" style="display:none">
          <div class="day-time-grid"></div>
        </div>
      </section>
    </div>
  </div>

  <!-- ───────────────── Modal “Nuevo / Editar evento” ───────────────── -->
  <div id="event-modal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Nuevo Evento</h3>
        <button class="close-modal">&times;</button>
      </div>

      <div class="modal-body">
        <form id="event-form">
          <div class="form-group">
            <label for="event-title">Título</label>
            <input id="event-title" type="text" required>
          </div>

          <div class="form-group">
            <label for="event-date">Fecha</label>
            <input id="event-date" type="date" required>
          </div>

          <div class="form-group" style="display:flex;gap:16px">
            <div style="flex:1">
              <label for="event-start-time">Hora de inicio</label>
              <input id="event-start-time" type="time" required>
            </div>
            <div style="flex:1">
              <label for="event-end-time">Hora de fin</label>
              <input id="event-end-time" type="time" required>
            </div>
          </div>

          <div class="form-group">
            <label for="event-description">Descripción</label>
            <textarea id="event-description" rows="3"></textarea>
          </div>

          <div class="form-group">
            <label for="event-category">Categoría</label>
            <select id="event-category">
              <option value="work">Trabajo</option>
              <option value="personal">Personal</option>
              <option value="family">Familia</option>
              <option value="important">Importante</option>
            </select>
          </div>

          <div class="form-group">
            <label>Color</label>
            <div class="color-picker">
              <div class="color-option selected" data-color="#4285F4" style="background:#4285F4"></div>
              <div class="color-option" data-color="#34A853" style="background:#34A853"></div>
              <div class="color-option" data-color="#FBBC05" style="background:#FBBC05"></div>
              <div class="color-option" data-color="#EA4335" style="background:#EA4335"></div>
            </div>
          </div>

          <div class="form-group">
            <label for="event-recurrence">Repetir</label>
            <select id="event-recurrence">
              <option value="none">No repetir</option>
              <option value="daily">Diariamente</option>
              <option value="weekly">Semanalmente</option>
              <option value="monthly">Mensualmente</option>
              <option value="yearly">Anualmente</option>
            </select>

            <div id="recurrence-options" class="recurrence-options" style="display:none">
              <label for="recurrence-end">Hasta</label>
              <input id="recurrence-end" type="date">
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button id="delete-event-btn" class="delete-button" style="display:none">Eliminar</button>
        <button id="cancel-btn">Cancelar</button>
        <button id="save-event-btn" class="primary">Guardar</button>
      </div>
    </div>
  </div>

  <!-- ───────────────── Scripts ───────────────── -->
  <script>
  /* ---------------- API REST ---------------- */
  const API = {
    list  : ()              => fetch('/api/events').then(r => r.json()),
    create: data            => fetch('/api/events', {
                                  method: 'POST',
                                  headers:{'Content-Type':'application/json'},
                                  body:JSON.stringify(data)
                                }).then(r => r.json()),
    update: (id,data)       => fetch('/api/events/'+id,{
                                  method:'PUT',
                                  headers:{'Content-Type':'application/json'},
                                  body:JSON.stringify(data)
                                }),
    remove: id              => fetch('/api/events/'+id, {method:'DELETE'})
  };

  /* ------------- Estado global -------------- */
  const state = {
    currentDate : new Date(),
    currentView : 'month',
    events      : [],
    selectedEvent: null,
    categoryColors: {
      work:'#4285F4', personal:'#34A853', family:'#FBBC05', important:'#EA4335'
    }
  };

  /* ------------- Helpers de fechas ---------- */
  const fmtMonth = d => d.toLocaleDateString('es-ES',{year:'numeric',month:'long'});
  const fmtLong  = d => d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  const sameDay  = (a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();

  /* ------------- Referencias DOM ------------ */
  const qs = s => document.querySelector(s);
  const monthBtn=qs('#month-view-btn'),weekBtn=qs('#week-view-btn'),dayBtn=qs('#day-view-btn');
  const todayBtn=qs('#today-btn'), addBtn=qs('#add-event-btn'), prevBtn=qs('#prev-btn'), nextBtn=qs('#next-btn');
  const titleEl=qs('.calendar-title');
  const monthView=qs('#month-view'),weekView=qs('#week-view'),dayView=qs('#day-view');
  const monthGrid=qs('.month-grid'),timeGrid=qs('.time-grid'),dayGrid=qs('.day-time-grid');
  const modal=qs('#event-modal'), closeModal=qs('.close-modal');
  const form=qs('#event-form'), titleInput=qs('#event-title'), dateInput=qs('#event-date');
  const startInput=qs('#event-start-time'), endInput=qs('#event-end-time'), descInput=qs('#event-description');
  const catInput=qs('#event-category'), recInput=qs('#event-recurrence'), recOpts=qs('#recurrence-options'), recEnd=qs('#recurrence-end');
  const colorOpts=document.querySelectorAll('.color-option');
  const cancelBtn=qs('#cancel-btn'), saveBtn=qs('#save-event-btn'), deleteBtn=qs('#delete-event-btn');

  /* ----------- Renderizado principal -------- */
  function render() {
    if(state.currentView==='month'){ monthView.style.display='block'; weekView.style.display='none'; dayView.style.display='none'; renderMonth(); }
    if(state.currentView==='week' ){ monthView.style.display='none';  weekView.style.display='flex'; dayView.style.display='none'; renderWeek();  }
    if(state.currentView==='day'  ){ monthView.style.display='none';  weekView.style.display='none'; dayView.style.display='flex'; renderDay();   }
  }

  /* ---------------- Month ------------------- */
  function monthDays(y,m){
    const first=new Date(y,m,1), last=new Date(y,m+1,0), cells=[];
    for(let i=first.getDay();i>0;i--) cells.push(new Date(y,m,1-i));
    for(let i=1;i<=last.getDate();i++) cells.push(new Date(y,m,i));
    for(let i=1;i<7-last.getDay();i++) cells.push(new Date(y,m+1,i));
    return cells;
  }
  function eventsOn(d){ return state.events.filter(e=>sameDay(new Date(e.date),d)); }

  function renderMonth(){
    titleEl.textContent=fmtMonth(state.currentDate);
    const today=new Date();
    // limpia celdas manteniendo headers
    const headers=[...monthGrid.querySelectorAll('.weekday-header')];
    monthGrid.innerHTML=''; headers.forEach(h=>monthGrid.appendChild(h));
    monthDays(state.currentDate.getFullYear(),state.currentDate.getMonth()).forEach(date=>{
      const cell=document.createElement('div'); cell.className='day-cell';
      if(date.getMonth()!==state.currentDate.getMonth()) cell.classList.add('different-month');
      if(sameDay(date,today)) cell.classList.add('today');
      const num=document.createElement('div'); num.className='day-number'; num.textContent=date.getDate();
      cell.appendChild(num);
      eventsOn(date).forEach(ev=>{
        const el=document.createElement('div'); el.className='event'; el.textContent=ev.title;
        el.style.background=ev.color||state.categoryColors[ev.category]||'#4285F4'; el.style.color='white';
        el.onclick=e=>{e.stopPropagation(); openEditModal(ev);};
        cell.appendChild(el);
      });
      cell.onclick=()=>openNewModal(date);
      monthGrid.appendChild(cell);
    });
  }

  /* ---------- Semana ---------- */
  function renderWeek() {
    const base = new Date(state.currentDate);
    base.setDate(base.getDate() - base.getDay());          // domingo inicio
    const semana = [...Array(7)].map((_,i)=>new Date(base.getFullYear(),base.getMonth(),base.getDate()+i));

    titleEl.textContent =
      semana[0].toLocaleDateString('es-ES',{day:'numeric',month:'long'}) +
      ' – ' +
      semana[6].toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'});

    timeGrid.innerHTML = '';
    // fila de cabecera
    timeGrid.appendChild(document.createElement('div'));   // esquina vacía
    semana.forEach(d=>{
      const h=document.createElement('div'); h.className='weekday-header';
      h.textContent=d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'});
      timeGrid.appendChild(h);
    });
    // filas de horas
    for(let h=0;h<24;h++){
      const label=document.createElement('div'); label.className='time-label'; label.textContent=h+':00';
      timeGrid.appendChild(label);
      semana.forEach(d=>{
        const slot=document.createElement('div'); slot.className='time-slot';
        const eventos=eventsOn(d).filter(e=>parseInt(e.startTime.split(':')[0])===h);
        eventos.forEach(ev=>{
          const el=document.createElement('div'); el.className='event';
          el.style.background=ev.color; el.style.color='white'; el.textContent=ev.title;
          el.onclick=e=>{e.stopPropagation();openEditModal(ev)};
          slot.appendChild(el);
        });
        slot.onclick=()=>openNewModal(new Date(d.getFullYear(),d.getMonth(),d.getDate(),h));
        timeGrid.appendChild(slot);
      });
    }
  }

  /* ---------- Día ------------- */
  function renderDay() {
    const d = state.currentDate;
    titleEl.textContent = d.toLocaleDateString('es-ES',
                      {weekday:'long',day:'numeric',month:'long',year:'numeric'});
    dayGrid.innerHTML='';
    for(let h=0;h<24;h++){
      const label=document.createElement('div'); label.className='time-label'; label.textContent=h+':00';
      dayGrid.appendChild(label);
      const slot=document.createElement('div'); slot.className='time-slot';
      eventsOn(d).filter(e=>parseInt(e.startTime.split(':')[0])===h).forEach(ev=>{
        const el=document.createElement('div'); el.className='event';
        el.style.background=ev.color; el.style.color='white';
        el.textContent=`${ev.title} (${ev.startTime.slice(0,5)}‑${ev.endTime.slice(0,5)})`;
        el.onclick=e=>{e.stopPropagation();openEditModal(ev)};
        slot.appendChild(el);
      });
      slot.onclick=()=>openNewModal(new Date(d.getFullYear(),d.getMonth(),d.getDate(),h));
      dayGrid.appendChild(slot);
    }
  }

  /* ─────────── Búsqueda (todavía desactivada) ─────────────────────────
  document.getElementById('search-form').addEventListener('submit', async e=>{
    e.preventDefault();
    const q = document.getElementById('search-input').value.trim();
    try{
      // GET /api/events?search=q
      state.events = await fetch('/api/events?search='+encodeURIComponent(q)).then(r=>r.json());
      render();
    }catch(err){ console.error('Error búsqueda', err); }
  });
  ────────────────────────────────────────────────────────────────────── */

  /* ------------- Modal --------------------- */
  function openNewModal(date){
    state.selectedEvent=null; form.reset();
    dateInput.value=date.toISOString().slice(0,10);
    const now=new Date(); now.setMinutes(Math.ceil(now.getMinutes()/30)*30);
    startInput.value=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const end=new Date(now); end.setHours(now.getHours()+1);
    endInput.value=`${String(end.getHours()).padStart(2,'0')}:${String(end.getMinutes()).padStart(2,'0')}`;
    catInput.value='work'; colorOpts.forEach(o=>o.classList.toggle('selected',o.dataset.color==='#4285F4'));
    deleteBtn.style.display='none'; qs('.modal-title').textContent='Nuevo Evento';
    modal.style.display='flex';
  }
  function openEditModal(ev){
    state.selectedEvent=ev;
    titleInput.value=ev.title; dateInput.value=ev.date; startInput.value=ev.startTime; endInput.value=ev.endTime;
    descInput.value=ev.description||''; catInput.value=ev.category; recInput.value=ev.recurrence||'none';
    recOpts.style.display=(ev.recurrence&&ev.recurrence!=='none')?'block':'none'; recEnd.value=ev.recurrenceEnd||'';
    colorOpts.forEach(o=>o.classList.toggle('selected',o.dataset.color===ev.color));
    deleteBtn.style.display='block'; qs('.modal-title').textContent='Editar Evento';
    modal.style.display='flex';
  }
  async function saveEvent(){
    if(!form.checkValidity()){ alert('Completa los campos obligatorios'); return; }
    let color=[...colorOpts].find(o=>o.classList.contains('selected')).dataset.color;
    const data={
      title:titleInput.value,date:dateInput.value,startTime:startInput.value,endTime:endInput.value,
      description:descInput.value,category:catInput.value,color,recurrence:recInput.value
    };
    if(recInput.value!=='none'&&recEnd.value) data.recurrenceEnd=recEnd.value;

    try{
      if(state.selectedEvent){ await API.update(state.selectedEvent.id,data); }
      else{ const {id}=await API.create(data); data.id=id; }
      modal.style.display='none'; await loadEvents();
    }catch(e){ alert('Error guardando: '+e.message); }
  }
  async function deleteEvent(){
    if(!state.selectedEvent) return;
    if(!confirm('¿Eliminar este evento?')) return;
    try{ await API.remove(state.selectedEvent.id); modal.style.display='none'; await loadEvents();}
    catch(e){ alert('Error: '+e.message); }
  }

  /* ----------- Navegación & listeners ------- */
  monthBtn.onclick=()=>{state.currentView='month'; monthBtn.classList.add('active'); weekBtn.classList.remove('active'); dayBtn.classList.remove('active'); render();};
  weekBtn.onclick=()=>{state.currentView='week';  monthBtn.classList.remove('active'); weekBtn.classList.add('active'); dayBtn.classList.remove('active'); render();};
  dayBtn .onclick=()=>{state.currentView='day';   monthBtn.classList.remove('active'); weekBtn.classList.remove('active'); dayBtn.classList.add('active'); render();};
  todayBtn.onclick=()=>{state.currentDate=new Date(); render();};
  prevBtn.onclick =()=>{ let d=state.currentDate; if(state.currentView==='month')d.setMonth(d.getMonth()-1);
                         else if(state.currentView==='week')d.setDate(d.getDate()-7); else d.setDate(d.getDate()-1); render(); };
  nextBtn.onclick =()=>{ let d=state.currentDate; if(state.currentView==='month')d.setMonth(d.getMonth()+1);
                         else if(state.currentView==='week')d.setDate(d.getDate()+7); else d.setDate(d.getDate()+1); render(); };
  addBtn.onclick =()=>openNewModal(state.currentDate);
  closeModal.onclick =()=>modal.style.display='none'; modal.onclick=e=>{if(e.target===modal)modal.style.display='none';};
  recInput.onchange =()=>recOpts.style.display=(recInput.value==='none')?'none':'block';
  colorOpts.forEach(o=>o.onclick=()=>{colorOpts.forEach(x=>x.classList.remove('selected')); o.classList.add('selected');});
  cancelBtn.onclick =()=>modal.style.display='none';
  saveBtn.onclick   =saveEvent;
  deleteBtn.onclick =deleteEvent;

  /* ------------- Carga inicial -------------- */
  async function loadEvents() {
    try {
      const raw = await API.list(); 
      // normalizo las propiedades:
      state.events = raw.map(ev => ({
        ...ev,
        startTime: ev.startTime ?? ev.start,
        endTime:   ev.endTime   ?? ev.end
      }));
      render();
    } catch (e) {
      console.error(e);
    }
  }
  loadEvents();
  </script>
</body>
</html>
