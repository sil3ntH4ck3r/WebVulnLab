# Configuración del servidor
server.port=80

# Configuración de Tomcat para permitir caracteres especiales en URLs
server.tomcat.relaxed-path-chars=|,{,},[,]
server.tomcat.relaxed-query-chars=|,{,},[,],^,`,",<,>

# Configuración adicional de Tomcat para el laboratorio
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB

# Configuración de logging
logging.level.org.apache.coyote.http11.Http11InputBuffer=WARN
logging.level.org.apache.tomcat=WARN

# Configuración específica para JNDI (VULNERABLE - Solo para laboratorio)
server.tomcat.additional-tld-skip-patterns=*.jar

# Configuración de Spring Boot
spring.main.banner-mode=console
spring.application.name=JNDI Injection Lab

# Configuración de Jackson para JSON
spring.jackson.default-property-inclusion=NON_NULL

# Configuración de seguridad (DESHABILITADA para el laboratorio)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration